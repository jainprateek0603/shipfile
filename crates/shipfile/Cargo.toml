[package]
name = "shipfile"
description = "One file in, a whole service out: run your stack locally with Docker, then deploy it to AWS."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
clap.workspace = true
clap_complete.workspace = true
fs4.workspace = true
miette.workspace = true
owo-colors.workspace = true
serde.workspace = true
serde_json.workspace = true
supports-unicode.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
insta.workspace = true
predicates.workspace = true

# `cargo binstall shipfile` downloads the dist release archive instead of building.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/shipfile-{ target }{ archive-suffix }"
bin-dir = "shipfile-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "txz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"
