[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/shipfile"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Prateek Jain <jainprateek.0603@gmail.com>"]
repository = "https://github.com/jainprateek0603/shipfile"
homepage = "https://github.com/jainprateek0603/shipfile"

[workspace.dependencies]
shipfile-core = { path = "crates/shipfile-core", version = "0.0.1" }
shipfile-cfn = { path = "crates/shipfile-cfn", version = "0.0.1" }
shipfile-gen = { path = "crates/shipfile-gen", version = "0.0.1" }
shipfile-local = { path = "crates/shipfile-local", version = "0.0.1" }
shipfile-aws = { path = "crates/shipfile-aws", version = "0.0.1" }
shipfile-plugin = { path = "crates/shipfile-plugin", version = "0.0.1" }

clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
miette = { version = "7.6.0", features = ["fancy"] }
owo-colors = { version = "4.4.0", features = ["supports-colors"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
clap_complete = "4.6.11"
fs4 = "1.1.0"
supports-unicode = "3.0.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "ansi", "std"] }

assert_cmd = "2.2.2"
predicates = "3.1.4"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
