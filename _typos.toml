# crate-ci/typos config
[default.extend-words]
# Deliberate misspellings in "did you mean" examples and tests.
qeue = "qeue"
sesions = "sesions"
medum = "medum"

[files]
# Broken specs are misspelled on purpose; snapshots copy them.
extend-exclude = ["CHANGELOG.md", "*.snap", "tests/fixtures/", "fuzz/corpus/"]
